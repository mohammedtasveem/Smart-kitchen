<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#43202e" />
    <meta
      name="description"
      content="Smart Kitchen -- food inventory tracking, expiry alerts and recipe suggestions."
    />

    <!--
      Two faces: Fraunces for headings and legacy figures (an optical serif that
      gives the interface its editorial, packaged-food feel), Manrope for
      everything read rather than glanced at. `preconnect` because the fonts sit
      on a second origin, so the DNS and TLS handshake would otherwise happen
      only after the CSS has been parsed. `display=swap` so text paints in the
      fallback immediately -- on a slow college network the alternative is a
      blank screen.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <title>Smart Kitchen — Inventory &amp; Expiry Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
